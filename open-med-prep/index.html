<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenMedPrep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-white">
    <div id="root"></div>
    <script>
        const e = React.createElement;
        const { useState } = React;
        const App = () => {
            const [activePage, setActivePage] = useState('home');
            if (activePage === 'quiz') {
                return e('div', { className: "p-10" }, 
                    e('h1', { className: "text-2xl font-bold mb-4" }, "Question 1"),
                    e('p', null, "Vignette: A 65-year-old male with sudden vision loss..."),
                    e('button', { onClick: () => setActivePage('home'), className: "mt-4 bg-blue-600 text-white p-2 rounded" }, "Go Back")
                );
            }
            return e('div', { className: "p-10" },
                e('h1', { className: "text-5xl font-black mb-4" }, "OpenMedPrep"),
                e('button', { onClick: () => setActivePage('quiz'), className: "bg-blue-600 text-white p-4 rounded-xl" }, "Start USMLE Prep")
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
