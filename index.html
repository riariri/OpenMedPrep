<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.321.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .icon-container svg { width: 100%; height: 100%; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = ({ name, size = 20, className = "", fill = "none", color = "currentColor" }) => {

                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = '';

                    const iconElement = document.createElement('i');
                    Object.entries(iconAttr).forEach(([key, value]) => iconElement.setAttribute(key, value));
                    iconElement.style.width = `${size}px`; iconElement.style.height = `${size}px`;
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons();

            }, [name, size, fill, color]);
            return React.createElement('span', { ref: iconRef, className: `inline-flex items-center justify-center icon-container ${className}`, style: { width: size, height: size } });

        const App = () => {
            const [activePage, setActivePage] = useState('home');
            const [selectedExam, setSelectedExam] = useState(null);
            const [selectedMock, setSelectedMock] = useState(null);
            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [isTimed, setIsTimed] = useState(false);
            const [timeLeft, setTimeLeft] = useState(0);
            const [flaggedQuestions, setFlaggedQuestions] = useState([]);
            const [showResults, setShowResults] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [showLabs, setShowLabs] = useState(false);

            // COMPREHENSIVE QUESTION GENERATOR (Generating ~150 questions total across 3 categories)
            const generateQuestions = (prefix, count, types) => {
                return Array.from({ length: count }, (_, i) => {
                    const type = types[i % types.length];
                    return {
                        id: `${prefix}-${i}`,
                        vignette: `${type.scenario} The patient is a ${20 + (i % 60)}-year-old with ${type.symptom}. Vital signs show HR ${80 + (i % 40)}, BP ${110 + (i % 30)}/70, Temp ${37 + (i % 2)}.`,
                        options: type.options,
                        correctAnswer: type.correctIdx,
                        explanation: `This case highlights ${type.pearl}. In medical boards, always look for ${type.clue} to differentiate from other diagnoses.`,
                        category: type.label
                    };
                });
            };

            const IM_TYPES = [
                { label: "Cardiology", scenario: "A patient presents with sudden tearing chest pain radiating to the back.", symptom: "a BP differential between arms", options: ["Aortic Dissection", "MI", "PE", "Pneumothorax"], correctIdx: 0, pearl: "the importance of the widened mediastinum on CXR", clue: "asymmetric pulses" },
                { label: "Endocrine", scenario: "A patient presents with polyuria, polydipsia, and weight loss.", symptom: "a fruity odor on their breath", options: ["Type 2 Diabetes", "DKA", "Diabetes Insipidus", "SIADH"], correctIdx: 1, pearl: "insulin deficiency leading to ketone production", clue: "anion gap acidosis" },
                { label: "Pulmonary", scenario: "A patient presents with acute onset shortness of breath after a long-haul flight.", symptom: "pleuritic chest pain", options: ["Pneumonia", "PE", "Asthma", "COPD"], correctIdx: 1, pearl: "Virchow's triad of stasis, hypercoagulability, and injury", clue: "S1Q3T3 on ECG" }

                        React.createElement('div', { className: "max-w-4xl mx-auto space-y-6 pb-20" },

                                    React.createElement('div', null, React.createElement('p', { className: "text-5xl font-black text-blue-600" }, `${Math.round((score/questions.length)*100)}%`), React.createElement('p', { className: "text-[10px] font-black uppercase text-slate-400 mt-2" }, "Accuracy")),
                                    React.createElement('div', null, React.createElement('p', { className: "text-5xl font-black text-slate-800" }, `${score}`), React.createElement('p', { className: "text-[10px] font-black uppercase text-slate-400 mt-2" }, "Correct")),

                                React.createElement('p', { className: "font-semibold text-slate-800 mb-6 leading-relaxed" }, item.vignette),
                                React.createElement('div', { className: "p-5 bg-blue-50/50 rounded-2xl border border-blue-100" },
                                    React.createElement('p', { className: "text-sm text-slate-700" }, React.createElement('span', { className: "font-black text-blue-600 uppercase text-[10px] block mb-1" }, "Educational Objective"), item.explanation)
                                )

                return React.createElement('div', { className: "h-screen bg-white flex flex-col relative" },
                    // TOP BAR
                    React.createElement('div', { className: "bg-slate-900 text-white p-5 flex items-center justify-between z-20" },
                        React.createElement('div', { className: "flex items-center gap-5" },
                            React.createElement('button', { onClick: () => setActivePage('home'), className: "text-white/40 hover:text-white" }, React.createElement(Icon, { name: "X" })),
                            React.createElement('div', { className: "h-8 w-px bg-white/10" }),
                            React.createElement('div', null, 
                                React.createElement('p', { className: "text-[9px] font-black uppercase text-blue-400 tracking-tighter" }, selectedMock),
                                React.createElement('h2', { className: "text-sm font-bold" }, `Q${currentQuestionIdx + 1} / ${questions.length}`)
                            )
                        ),
                        React.createElement('div', { className: "flex items-center gap-6" },
                            React.createElement('button', { onClick: () => setShowLabs(!showLabs), className: "text-xs font-black uppercase bg-white/10 px-4 py-2 rounded-lg hover:bg-white/20" }, "Lab Values"),
                            isTimed && React.createElement('div', { className: `font-mono text-lg font-bold ${timeLeft < 300 ? 'timer-low' : ''}` }, formatTime(timeLeft)),
                            React.createElement('button', { onClick: () => setFlaggedQuestions(f => f.includes(q.id) ? f.filter(id => id !== q.id) : [...f, q.id]), className: `flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-xs ${isFlagged ? 'bg-orange-500' : 'bg-white/5 text-white/30'}` }, React.createElement(Icon, { name: "Bookmark", size: 14, fill: isFlagged ? "white" : "none" }), isFlagged ? "Flagged" : "Flag")
                        )
                    ),
                    // LAB PANEL OVERLAY
                    showLabs && React.createElement('div', { className: "absolute top-20 right-8 w-80 bg-white shadow-2xl rounded-3xl border border-slate-200 p-6 z-50 animate-fade-in" },
                        React.createElement('div', { className: "flex justify-between items-center mb-4" }, React.createElement('h3', { className: "font-black text-sm uppercase" }, "Standard Labs"), React.createElement('button', { onClick: () => setShowLabs(false) }, React.createElement(Icon, { name: "X", size: 16 }))),
                        React.createElement('div', { className: "space-y-3" }, LAB_VALUES.map(l => React.createElement('div', { key: l.name, className: "flex justify-between text-xs py-2 border-b border-slate-50" }, React.createElement('span', { className: "text-slate-500 font-medium" }, l.name), React.createElement('span', { className: "font-bold" }, l.range))))

                    React.createElement('div', { className: "flex-1 overflow-y-auto p-12 lg:px-64 lg:py-20" },
                        React.createElement('div', { className: "max-w-4xl mx-auto" },
                            React.createElement('p', { className: "text-2xl font-bold text-slate-800 leading-relaxed mb-12" }, q.vignette),
                            React.createElement('div', { className: "space-y-3" },
                                q.options.map((opt, idx) => React.createElement('button', {
                                    key: idx,
                                    onClick: () => setAnswers({...answers, [currentQuestionIdx]: idx}),
                                    className: `w-full text-left p-6 rounded-2xl border-2 transition-all flex items-center gap-5 ${answers[currentQuestionIdx] === idx ? 'border-blue-600 bg-blue-50/50' : 'border-slate-100 hover:border-slate-300 bg-white'}`
                                },
                                    React.createElement('div', { className: `w-10 h-10 rounded-xl flex items-center justify-center font-bold ${answers[currentQuestionIdx] === idx ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}` }, String.fromCharCode(65 + idx)),
                                    React.createElement('span', { className: "font-bold text-slate-700" }, opt)
                                ))
                            )
                        )
                    ),
                    // FOOTER
                    React.createElement('div', { className: "p-6 border-t border-slate-100 bg-white flex justify-between items-center shadow-lg" },
                        React.createElement('button', { onClick: () => setCurrentQuestionIdx(prev => prev - 1), disabled: currentQuestionIdx === 0, className: "px-8 py-3 font-bold text-slate-400 disabled:opacity-0" }, "Previous"),
                        React.createElement('div', { className: "flex gap-4" },
                            currentQuestionIdx + 1 === questions.length ? 
                            React.createElement('button', { onClick: () => setShowResults(true), className: "bg-blue-600 text-white px-10 py-4 rounded-2xl font-black shadow-xl shadow-blue-100" }, "Finish Exam") :
                            React.createElement('button', { onClick: () => setCurrentQuestionIdx(prev => prev + 1), className: "bg-slate-900 text-white px-12 py-4 rounded-2xl font-black hover:bg-black" }, "Next Question")
                        )
                    )
                );
            }

            return React.createElement('div', { className: "min-h-screen flex bg-slate-50/50" },
                // SIDEBAR
                React.createElement('aside', { className: "w-72 bg-white border-r border-slate-200 hidden lg:flex flex-col" },
                    React.createElement('div', { className: "p-8 mb-4" },
                        React.createElement('div', { className: "flex items-center gap-3" },
                            React.createElement('div', { className: "w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200" }, React.createElement(Icon, { name: "Stethoscope", fill: "white" })),
                            React.createElement('span', { className: "font-black text-xl tracking-tighter" }, "OpenMedPrep")
                        )
                    ),
                    React.createElement('nav', { className: "px-4 space-y-1" },
                        [
                            { id: 'home', icon: 'Layout', label: 'Dashboard' },
                            { id: 'bank', icon: 'Database', label: 'Question Bank' },
                            { id: 'stats', icon: 'BarChart2', label: 'Analytics' },
                            { id: 'library', icon: 'BookOpen', label: 'Study Library' }
                        ].map(item => React.createElement('button', {
                            key: item.id,
                            onClick: () => setActivePage(item.id),
                            className: `w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all ${activePage === item.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'text-slate-400 hover:text-slate-900'}`
                        }, React.createElement(Icon, { name: item.icon, color: activePage === item.id ? "white" : "currentColor" }), item.label))
                    ),
                    React.createElement('div', { className: "mt-auto p-6" },
                        React.createElement('div', { className: "bg-slate-900 rounded-3xl p-6 text-white" },
                            React.createElement('p', { className: "text-xs font-black text-white/40 uppercase mb-4" }, "Weekly Goal"),
                            React.createElement('div', { className: "flex justify-between items-end mb-2" }, React.createElement('span', { className: "text-2xl font-black" }, "64%"), React.createElement('span', { className: "text-[10px] text-white/40" }, "320 / 500 Qs")),
                            React.createElement('div', { className: "h-2 w-full bg-white/10 rounded-full overflow-hidden" }, React.createElement('div', { className: "h-full bg-blue-500", style: { width: '64%' } }))
                        )
                    )
                ),
                // MAIN DASHBOARD
                React.createElement('main', { className: "flex-1 h-screen overflow-y-auto custom-scrollbar" },

                        React.createElement('header', { className: "flex flex-col md:flex-row md:items-end justify-between gap-6 mb-16 animate-fade-in" },
                            React.createElement('div', null,
                                React.createElement('h1', { className: "text-5xl font-black tracking-tighter mb-2" }, "Dashboard"),
                                React.createElement('p', { className: "text-slate-400 text-lg font-medium" }, "Focus on Internal Medicine today.")

                            React.createElement('div', { className: "flex items-center gap-4 bg-white p-3 px-6 rounded-3xl shadow-sm border border-slate-200" },
                                React.createElement('span', { className: "font-black text-xs text-slate-400 uppercase tracking-widest" }, "Simulation Mode"),
                                React.createElement('button', { onClick: () => setIsTimed(!isTimed), className: `w-12 h-7 rounded-full relative transition-all ${isTimed ? 'bg-blue-600' : 'bg-slate-200'}` }, 
                                    React.createElement('div', { className: `absolute top-1 w-5 h-5 bg-white rounded-full transition-all ${isTimed ? 'left-6' : 'left-1'}` })
                                )
                            )
                        ),

                        React.createElement('div', { className: "grid grid-cols-1 lg:grid-cols-3 gap-12" },
                            React.createElement('div', { className: "lg:col-span-2 space-y-12" },
                                Object.entries(MOCKS).map(([examKey, mocks], sectionIdx) => (
                                    React.createElement('section', { key: examKey, className: "space-y-6 animate-fade-in", style: { animationDelay: `${sectionIdx * 0.1}s` } },

                                        ),

                                            Object.keys(mocks).map(name => (
                                                React.createElement('div', { key: name, className: "bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm hover:shadow-xl transition-all group cursor-pointer", onClick: () => startExam(examKey, name) },
                                                    React.createElement('div', { className: "flex justify-between items-start mb-6" },
                                                        React.createElement('div', { className: "w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition-all" }, React.createElement(Icon, { name: "ClipboardCheck" })),
                                                        React.createElement('div', { className: "flex flex-col items-end" }, 
                                                            React.createElement('span', { className: "text-[10px] font-black text-slate-300 uppercase" }, "Length"),
                                                            React.createElement('span', { className: "text-sm font-bold text-slate-600" }, `${mocks[name].length} Qs`)
                                                        )
                                                    ),
                                                    React.createElement('h4', { className: "text-xl font-black mb-1 leading-tight" }, name),
                                                    React.createElement('p', { className: "text-sm text-slate-400 font-medium mb-8" }, "High-yield vignettes covering core specialty concepts."),

                                    React.createElement('h3', { className: "font-black text-sm uppercase text-slate-400 mb-6 tracking-widest" }, "Performance Matrix"),
                                    React.createElement('div', { className: "space-y-6" },

                                    React.createElement('button', { className: "w-full py-4 bg-white text-blue-600 rounded-2xl font-black text-sm uppercase shadow-lg shadow-blue-800/20" }, "Generate Full Mock")

    </script>
</body>
